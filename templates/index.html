<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ModaMoments - Shop Fashion Reels</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
</head>
<body>
    <div id="app">
        <!-- Search Bar -->
        <div id="search-container" class="search-container" style="display: none;">
            <div class="search-wrapper">
                <input 
                    type="text" 
                    id="search-input" 
                    class="search-input" 
                    placeholder="Search reels, products, influencers..."
                    autocomplete="off"
                />
                <button id="search-clear" class="search-clear" style="display: none;">&times;</button>
                <span class="search-icon">🔍</span>
            </div>
            <div id="search-results-count" class="search-results-count"></div>
        </div>

        <!-- Loading Screen -->
        <div id="loading" class="loading-screen">
            <div class="spinner"></div>
            <p>Loading fashion reels...</p>
        </div>

        <!-- Reel Feed Container -->
        <div id="reel-feed" class="reel-feed" style="display: none;">
            <!-- Reels will be dynamically inserted here -->
        </div>

        <!-- Product Modal -->
        <div id="product-modal" class="product-modal">
            <div class="product-modal-content">
                <span class="close-modal">&times;</span>
                <div id="product-details"></div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
