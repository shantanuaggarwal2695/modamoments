version: '3.8'

services:
  app:
    build: .
    ports:
      - "8888:8888"
    environment:
      - PORT=8888
      - SESSION_SECRET=dev-secret-key
      - VIDEO_STORAGE_PATH=/modamoments/data
    volumes:
      # Mount local videos directory to the volume mount point
      - ./data/reels:/modamoments/data:ro
      # Or use a separate volume
      # - video_storage:/modamoments/data
    restart: unless-stopped

# Uncomment to use a named volume instead
# volumes:
#   video_storage:
